name: Multi-Environment Deployment Pipeline

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy-staging:
    name: Deploy to Staging
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.example.com
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Deploying Application
        run: |
          echo "Bắt đầu triển khai lên môi trường STAGING..."
          echo "Triển khai nhánh develop thành công!"

  deploy-prod:
    name: Deploy to Production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.prod.example.com
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Deploying Application
        run: |
          echo "Bắt đầu triển khai lên môi trường PRODUCTION..."
          echo "Triển khai nhánh main lên Production hoàn tất!"